name: Build x86_64 OpenWarp DMG

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        type: choice
        options:
          - oss
        default: oss

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "10.14"

jobs:
  build:
    name: Build OpenWarp (x86_64)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
          rustup target add x86_64-apple-darwin

      - name: Install Xcode MetalToolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install cargo-bundle
        run: script/install_cargo_bundle

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@dc19f1e48450eefe5a29b8da6c6b00a87d730b37

      - name: Build x86_64 bundle
        run: |
          script/bundle \
            --channel oss \
            --arch x86_64 \
            --nosign \
            --dmg-name-suffix x86_64

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWarp-x86_64
          path: target/x86_64-apple-darwin/release-lto/bundle/osx/OpenWarp-x86_64.dmg
          retention-days: 7
